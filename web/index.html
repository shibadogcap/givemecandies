<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お菓子をあげる | givemecandies</title><meta name="description" content="好きなだけお菓子を送れるページ。1 リクエストで最大 2 兆個。"><link rel="icon" href="/icon.webp" type="image/webp"><link rel="apple-touch-icon" href="/icon.webp"><meta property="og:type" content="website"><meta property="og:site_name" content="givemecandies"><meta property="og:title" content="お菓子をあげる"><meta property="og:description" content="好きなだけお菓子を送れるページ。1 リクエストで最大 2 兆個。"><meta property="og:url" content="https://givemecandies.shibadogcap.com/"><meta property="og:image" content="https://givemecandies.shibadogcap.com/og.png"><meta property="og:image:type" content="image/png"><meta property="og:image:alt" content="シバイヌとキャンディのイラスト"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="お菓子をあげる"><meta name="twitter:description" content="好きなだけお菓子を送れるページ。1 リクエストで最大 2 兆個。"><meta name="twitter:image" content="https://givemecandies.shibadogcap.com/og.png"><meta name="twitter:image:alt" content="シバイヌとキャンディのイラスト"><meta name="twitter:url" content="https://givemecandies.shibadogcap.com/"><style>:root{--cream:#FFF9EC;--card:#FFFFFF;--yellow:#FFDD00;--yellow-down:#E8C800;--ink:#2F2A24;--brown:#6B5B4B;--line:#EFE5D2;--soft:#FFFDF6;--alert:#D14343;}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background-image:radial-gradient(#F1E7D2 1px,transparent 1px);background-size:18px 18px;display:flex;justify-content:center;padding:28px 16px 40px}.wrap{width:100%;max-width:460px;position:relative}.brand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:18px;font-weight:800;color:var(--brown);font-size:15px}.brand .dot{width:18px;height:18px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px 22px;box-shadow:0 18px 40px -24px #6B5B4B66,0 2px 0 #EFE5D2}.card.shake{animation:shake .5s}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}.hero{text-align:center}.avatar{position:relative;width:92px;height:92px;border-radius:50%;margin:0 auto 14px;background:var(--yellow);display:grid;place-items:center;font-size:40px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 8px 20px -10px #6B5B4B88}.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}.who{margin:5px 0 18px;font-size:12.5px;color:var(--brown)}.total{font-variant-numeric:tabular-nums;font-size:40px;font-weight:850;line-height:1.05;letter-spacing:-.02em;word-break:break-all}.total .u{font-size:16px;font-weight:700;color:var(--brown);margin-left:4px}.meta{margin:6px 0 20px;font-size:11.5px;color:var(--brown);font-variant-numeric:tabular-nums}.meta b{color:var(--ink);font-weight:700}.tabs{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:18px}.tab{flex:1;border:0;background:transparent;padding:10px 0;border-radius:10px;font:inherit;font-size:13.5px;font-weight:700;color:var(--brown);cursor:pointer}.tab[aria-selected=true]{background:var(--yellow);color:var(--ink);box-shadow:0 1px 0 #E8C800}label{display:block;font-size:12.5px;font-weight:700;color:var(--brown);margin:0 0 8px}.field{position:relative;margin-bottom:18px}input{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:14px 15px;font:inherit;font-size:16px;color:var(--ink);outline:none;min-height:52px}input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px #FFDD0040;background:#fff}.field .suffix{position:absolute;right:15px;top:15px;font-size:13px;color:var(--brown);pointer-events:none}.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 26px -12px #6B5B4B66;overflow:hidden;z-index:5}.sug:empty{display:none}.sug button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px 15px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}.sug button:last-child{border-bottom:0}.sug button:hover{background:var(--soft)}.cta{width:100%;border:0;border-radius:16px;background:var(--yellow);color:var(--ink);padding:17px;font:inherit;font-size:16px;font-weight:850;cursor:pointer;box-shadow:0 4px 0 var(--yellow-down);transition:transform .06s,box-shadow .06s}.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-down)}.msg{min-height:20px;margin:12px 0 0;font-size:12px;color:var(--brown);line-height:1.6;text-align:center}.msg.err{color:var(--alert)}.share{margin-top:14px;text-align:center}.share button{border:1.5px solid var(--line);background:#fff;color:var(--brown);border-radius:999px;padding:9px 16px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}.share button:hover{border-color:var(--yellow);color:var(--ink)}#rank .rhead{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--brown);padding:0 4px 8px;border-bottom:1px solid var(--line)}ol{list-style:none;margin:0;padding:0}ol li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #F7F0E1;font-size:13.5px}ol li:last-child{border-bottom:0}ol .pos{width:22px;text-align:right;color:var(--brown);font-variant-numeric:tabular-nums;font-size:12px}ol .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}ol .tt{font-variant-numeric:tabular-nums;color:var(--brown);font-size:12.5px}.empty{padding:26px 0;text-align:center;color:var(--brown);font-size:12.5px}.candy{position:fixed;font-size:24px;pointer-events:none;z-index:50;will-change:transform,opacity;animation:pop 1s cubic-bezier(.2,.7,.3,1) forwards}@keyframes pop{0%{transform:translate(0,0) scale(.6) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rot));opacity:0}}.modal{position:fixed;inset:0;background:#2F2A2455;display:grid;place-items:center;padding:24px;z-index:100}.modal[hidden]{display:none}.dialog{width:100%;max-width:300px;background:#fff;border-radius:18px;padding:22px 20px 16px;text-align:center;box-shadow:0 24px 60px -20px #2F2A2488}.dialog h2{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--brown)}.dialog p{margin:0 0 18px;font-size:13.5px;line-height:1.7;color:var(--ink)}.dialog button{width:100%;border:0;border-radius:12px;background:var(--yellow);color:var(--ink);padding:12px;font:inherit;font-weight:800;cursor:pointer}@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class="wrap"><div class="brand"><span class="dot">🍬</span>givemecandies</div><main class="card" id="card"><div class="hero"><div class="avatar"><span>🍬</span><img src="/icon.webp" alt="" onerror="this.remove()"></div><h1>お菓子をあげる</h1><p class="who">shibadogcap さんに、好きなだけ</p><div class="total"><span id="total">0</span><span class="u" id="unit"></span></div><div class="meta">もらった数・いま <b id="rate">0</b> 個/s・<b id="ips">0</b> 人</div></div><div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="give" aria-selected="true">あげる</button><button class="tab" role="tab" data-tab="rank" aria-selected="false">ランキング</button></div><section id="give"><label for="name">お名前</label><div class="field"><input id="name" maxlength="24" placeholder="なまえ" autocomplete="off" spellcheck="false"><div class="sug" id="sug"></div></div><label for="amount">お菓子の数</label><div class="field"><input id="amount" inputmode="numeric" value="1" autocomplete="off"><span class="suffix">個</span></div><button class="cta" id="send">お菓子をあげる</button><p class="msg" id="msg"></p><div class="share"><button id="share" hidden>シェアする</button></div></section><section id="rank" hidden><div class="rhead"><span>あげた人</span><span>個数</span></div><ol id="rows"><li class="empty">まだ誰もあげていません</li></ol></section></main></div><div class="modal" id="modal" hidden><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="mtitle"><h2 id="mtitle">おしらせ</h2><p id="mbody"></p><button id="mok">OK</button></div></div><script>
const $=s=>document.querySelector(s);
const UNITS=[[10n**28n,"穣"],[10n**24n,"秭"],[10n**20n,"垓"],[10n**16n,"京"],[10n**12n,"兆"],[10n**8n,"億"],[10n**4n,"万"]];
const MAX=2000000000000n;
const SITE='https://givemecandies.shibadogcap.com/';
function fmt(v){
if(v<10000n) return v.toLocaleString('ja-JP');
for(const [s,u] of UNITS) if(v>=s){
const w=v/s, f=(v%s)*1000n/s;
return w.toLocaleString('ja-JP')+(f?'.'+String(f).padStart(3,'0').replace(/0+$/,''):'')+u;
}
return v.toLocaleString('ja-JP');
}
let total=0n, inflight=0, lastRate=0, names=[];
const MAX_INFLIGHT=8, q=[];
function show(){ $('#total').textContent=fmt(total); $('#rate').textContent=fmt(BigInt(lastRate)); }
function pump(){ while(q.length && inflight<MAX_INFLIGHT){ inflight++; sendOne(q.shift()); } }
async function sendOne(item){
try{
const r=await fetch('/c',{method:'POST',headers:{'Content-Type':'text/plain'},
body:JSON.stringify({name:item.name, amount:Number(item.n), rid:crypto.randomUUID()})});
if(r.status===204){ total+=item.n; $('#msg').textContent=''; $('#msg').className='msg'; burst(item.n); remember(item.name); }
else if(r.status===429){ $('#msg').textContent='送りすぎです。少し待ってください。'; $('#msg').className='msg err'; }
else { $('#msg').textContent='送れませんでした ('+r.status+')'; $('#msg').className='msg err'; }
}catch(e){ $('#msg').textContent='通信できませんでした'; $('#msg').className='msg err'; }
inflight--; pump(); show();
}
function readAmount(){
const raw=$('#amount').value.replace(/[,_\s]/g,'').normalize('NFKC');
if(!/^\d+$/.test(raw)) return 0n;
const n=BigInt(raw); return n>MAX?MAX:n;
}
function remember(name){
if(!name) return;
if(!names.includes(name)) names=[name,...names].slice(0,50);
try{ localStorage.setItem('candy.name',name); }catch(e){}
}
function burst(n){
const btn=$('#send').getBoundingClientRect();
const count = n >= 1000000000000n ? 8 : (n >= 10000n ? 5 : 3);
for(let i=0;i<count;i++){
const el=document.createElement('div');
el.className='candy';
el.textContent = Math.random()<.5 ? '🍬' : (Math.random()<.5 ? '🍭' : '🍫');
el.style.left=(btn.left+btn.width/2-12)+'px';
el.style.top=(btn.top+8)+'px';
el.style.setProperty('--dx',(Math.random()*220-110).toFixed(0)+'px');
el.style.setProperty('--dy',(-90-Math.random()*120).toFixed(0)+'px');
el.style.setProperty('--rot',(Math.random()*540-270).toFixed(0)+'deg');
document.body.append(el);
setTimeout(()=>el.remove(),1100);
}
}
const PRANKS=[
'0 個…？ それ、お菓子じゃないよ。',
'0 個あげるなら、何ももらえないよ。',
'まさか 0 個で済ませるつもり？',
'0 個は 0 個。算数は裏切らない。',
'気持ちだけ受け取っておきます。0 個なので。'
];
let prankIdx=0;
function prank(){
$('#mbody').textContent = PRANKS[prankIdx++ % PRANKS.length];
$('#modal').hidden=false;
$('#card').classList.remove('shake'); void $('#card').offsetWidth; $('#card').classList.add('shake');
}
function closeModal(){ $('#modal').hidden=true; }
$('#mok').onclick=closeModal;
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#modal').hidden) closeModal(); });
function submit(){
const name=$('#name').value.trim().replace(/\s+/g,' ');
const n=readAmount();
if(!name){ $('#msg').textContent='お名前を入れてください'; $('#msg').className='msg err'; $('#name').focus(); return; }
if(n<=0n){ prank(); return; }
const keep=$('#amount').value;          // the number stays after sending
$('#sug').replaceChildren();
q.push({name,n}); pump();
$('#amount').value=keep;
}
$('#send').onclick=submit;
$('#amount').addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
$('#name').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
$('#name').addEventListener('input',()=>{
const v=$('#name').value.trim(), box=$('#sug');
if(!v){ box.replaceChildren(); return; }
const hits=names.filter(n=>n.toLowerCase().includes(v.toLowerCase())).slice(0,5);
box.replaceChildren();
for(const h of hits){
const b=document.createElement('button'); b.type='button'; b.textContent=h;
b.onclick=()=>{ $('#name').value=h; box.replaceChildren(); };
box.append(b);
}
});
document.addEventListener('click',e=>{ if(!e.target.closest('.field')) $('#sug').replaceChildren(); });
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===t)));
const rank=t.dataset.tab==='rank';
$('#give').hidden=rank; $('#rank').hidden=!rank;
if(rank) loadRank();
});
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
async function loadRank(){
try{
const d=await (await fetch('/api/ranking',{cache:'no-store'})).json();
const rows=$('#rows');
if(!d.senders.length){ rows.innerHTML='<li class="empty">まだ誰もあげていません</li>'; return; }
rows.innerHTML=d.senders.map((s,i)=>
'<li><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(s.name)+'</span><span class="tt">'+fmt(BigInt(s.total))+'</span></li>'
).join('');
for(const s of d.senders) if(!names.includes(s.name)) names.push(s.name);
}catch(e){}
}
// share
{
const b=$('#share'); b.hidden=false;
b.onclick=async()=>{
const data={title:'お菓子をあげる', text:'givemecandies でお菓子をあげられます', url:SITE};
if(navigator.share){
try{ await navigator.share(data); return; }catch(e){ if(e && e.name==='AbortError') return; }
}
try{ await navigator.clipboard.writeText(SITE); b.textContent='リンクをコピーしました'; }
catch(e){ b.textContent='コピーできませんでした'; }
setTimeout(()=>{ b.textContent='シェアする'; },1800);
};
}
async function poll(){
try{
const d=await (await fetch('/api/stats',{cache:'no-store'})).json();
total=BigInt(d.total); lastRate=d.rate; $('#ips').textContent=d.ips??0; show();
}catch(e){}
setTimeout(poll,1000);
}
setInterval(()=>{ if(!$('#rank').hidden) loadRank(); },5000);
try{ const saved=localStorage.getItem('candy.name'); if(saved) $('#name').value=saved; }catch(e){}
show(); poll();
</script></body></html>
