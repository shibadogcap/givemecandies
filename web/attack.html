<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>honeypot</title>
<style>
:root{--bg:#0b0d10;--panel:#12161b;--line:#1f262e;--ink:#d7e0ea;--muted:#7d8b9c;--accent:#5ee2a0;--warn:#ffb454;--hot:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:20px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin:0 0 14px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cell .k{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cell .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:4px}
.cell .v.small{font-size:15px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.chart svg{display:block;width:100%;height:70px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.panel h2{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:3px 0;vertical-align:top;border-bottom:1px solid #171c22}
tr:last-child td{border-bottom:0}
td.n{text-align:right;color:var(--accent);font-variant-numeric:tabular-nums;width:64px;padding-left:8px}
td.t{word-break:break-all;color:var(--ink)}
.bait{color:var(--warn)}
.foot{margin-top:12px;font-size:11px;color:var(--muted)}
</style></head>
<body><div class="wrap">
<h1>givemecandies / honeypot</h1>
<div class="grid">
  <div class="cell"><div class="k">rps</div><div class="v" id="rps">0</div></div>
  <div class="cell"><div class="k">peak</div><div class="v" id="peak">0</div></div>
  <div class="cell"><div class="k">ips 60s</div><div class="v" id="ips60">0</div></div>
  <div class="cell"><div class="k">bait hits</div><div class="v" id="bait">0</div></div>
</div>
<div class="cell" style="margin-bottom:12px"><div class="k">requests total</div><div class="v small" id="total">0</div></div>
<div class="chart"><svg id="spark" viewBox="0 0 600 70" preserveAspectRatio="none"></svg></div>
<div class="cols">
  <div class="panel"><h2>paths</h2><table id="paths"></table></div>
  <div class="panel"><h2>user agents</h2><table id="uas"></table></div>
</div>
<div class="cols" style="margin-top:10px">
  <div class="panel"><h2>countries</h2><table id="ctry"></table></div>
  <div class="panel"><h2>status</h2><table id="st"></table></div>
</div>
<div class="foot" id="foot"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const hist=[];
function rows(el, arr, cls){
  el.innerHTML = arr.map(r=>'<tr><td class="t '+(cls?cls(r.k):'')+'">'+esc(r.k)+'</td><td class="n">'+r.n.toLocaleString()+'</td></tr>').join('');
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function spark(){
  const w=600,h=70,n=hist.length; if(!n) return;
  const mx=Math.max(...hist,1);
  const bw=w/Math.max(n,60);
  const bars=hist.map((v,i)=>{
    const bh=Math.max(1,(v/mx)*(h-6));
    return '<rect x="'+(i*bw).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+Math.max(bw-1,1).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="#5ee2a0" opacity="'+(0.35+0.65*(v/mx)).toFixed(2)+'"/>';
  }).join('');
  $('#spark').innerHTML=bars;
}
async function tick(){
  try{
    const d=await (await fetch('/api/attack',{cache:'no-store'})).json();
    $('#rps').textContent=d.rps; $('#peak').textContent=d.peak;
    $('#ips60').textContent=d.ips60; $('#bait').textContent=(d.bait||0).toLocaleString();
    $('#total').textContent=d.total.toLocaleString();
    hist.push(d.rps); if(hist.length>60) hist.shift(); spark();
    rows($('#paths'), d.top_path, k=>k.indexOf('.env')>=0||k.indexOf('wp-')>=0||k.indexOf('admin')>=0?'bait':'');
    rows($('#uas'), d.top_ua);
    rows($('#ctry'), Object.entries(d.country||{}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>({k,n})));
    rows($('#st'), Object.entries(d.status||{}).sort((a,b)=>b[1]-a[1]).map(([k,n])=>({k,n})));
    $('#foot').textContent='total candy '+d.total_candy+' / distinct ips seen '+(d.ips||0);
  }catch(e){ $('#foot').textContent='disconnected'; }
  setTimeout(tick,2000);
}
tick();
</script>
</body></html>
